name: Refresh market scores

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_market.py"
      - "data/stocks.json"
      - ".github/workflows/market-refresh.yml"
  schedule:
    - cron: "7,37 9-15 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: market-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market data dependencies
        run: pip install --disable-pip-version-check yfinance pandas

      - name: Recalculate price-sensitive scores
        run: python scripts/update_market.py

      - name: Commit refreshed scores
        run: |
          if [ -z "$(git status --porcelain -- data/live_scores.json)" ]; then
            echo "No score changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_scores.json
          git commit -m "data: refresh live market scores"
          git push
